# Jekyll configuration for the course website (source: /docs).
# The site uses a small custom layout (docs/_layouts) rather than a theme,
# so course pages stay lightweight and fully under the course's control.
title: Programming Fundamentals Using C++
description: A complete, free, self-study course in programming with C++ — 16 units, 32 sessions, labs, projects, and quizzes.
lang: en
markdown: kramdown
kramdown:
  input: GFM

# Plugins used by the build (see the root Gemfile).
#
# Keep this whitelist in lockstep with the Gemfile: Jekyll `require`s every
# whitelisted plugin at startup, so a whitelist entry without a matching
# `gem` line breaks the build with "Dependency Error: <plugin> is missing".
# (jekyll-coffeescript, jekyll-gist and jekyll-github-metadata were once
# listed here but no course page uses them — they are NOT whitelisted any
# more, and must not be re-added without also adding their gem to the
# Gemfile.)
#
# GitHub Pages also ships its own default plugins (jekyll-sitemap,
# jekyll-feed, jekyll-seo-tag, …). Those are intentionally not whitelisted:
# the site has a custom layout stack and needs none of them, and the
# whitelist keeps local, CI and Pages builds identical.
plugins:
  - jekyll-relative-links

# Every course page renders inside the same layout (header, breadcrumbs,
# content, prev/next pager, footer). Pages that set their own `layout:`
# in front matter (index.md, 404.md) keep it; those that don't get this one.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Kept in the repository for contributors, not published on the student site.
# They remain fully readable on GitHub.
exclude:
  - course-architecture.md
  - implementation-plan.md
  - technical

# Production deploys build this folder with GitHub Actions
# (.github/workflows/deploy.yml) and publish with the official Pages actions.
# To preview locally:  bundle exec jekyll serve --source docs --baseurl ""
